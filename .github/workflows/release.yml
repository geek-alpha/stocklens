name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  windows:
    # 在 Windows runner 上打包，不需要 wine，且产物与最终用户环境一致
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 打包 Windows 安装包与便携版
        run: npm run dist:win

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: stocklens-windows
          path: |
            release/*/*.exe
            release/*/*.blockmap
          if-no-files-found: error

      - name: 附到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*/StockLens-Setup-*.exe
            release/*/StockLens-Portable-*.exe
          generate_release_notes: true
